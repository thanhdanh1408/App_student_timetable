name: student_timetable_app
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Legacy (to be removed in next phase)
  provider: ^6.1.2
  
  # Routing
  go_router: ^14.0.0
  
  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.4
  equatable: ^2.0.5
  table_calendar: ^3.1.3
  pdf: ^3.11.1
  share_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  shimmer: ^3.0.0
  file_picker: ^8.0.0
  home_widget: ^0.7.0+1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.7.0
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  mockito: ^5.4.4
  
  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/